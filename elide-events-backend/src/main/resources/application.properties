# PostgreSQL connection (create the database eliade_event in pgAdmin first)
spring.datasource.url=jdbc:postgresql://localhost:5432/eliade_event
spring.datasource.username=postgres
spring.datasource.password=postgres

# HikariCP: concurrent transactions wait for a free connection instead of failing
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=120000

# Integrity rules are checked by the domain validation service, not by the JPA provider
spring.jpa.properties.javax.persistence.validation.mode=none

# JPA naming strategies: tables/columns keep the names of the entity classes/fields (as in the course sample)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Schema generation: tables are created/updated by Hibernate at startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
# parents are inserted before their children
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# logging
logging.level.org.hibernate.SQL=warn
